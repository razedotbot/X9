[package]
name = "raze-trading"
version = "0.3.0"
edition = "2021"
description = "Rust SDK for the Raze Trading REST API"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
