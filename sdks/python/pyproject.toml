[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "raze-trading"
version = "0.3.0"
description = "Python SDK for the Raze Trading REST API"
requires-python = ">=3.10"
license = "MIT"
keywords = ["raze", "solana", "trading", "api", "sdk"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]
