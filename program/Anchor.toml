[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
raze_router = "RAZEX9pxDuRCrtwR5wxUPAX3pWwAkBzvM8hF2fKaRE9"

[programs.localnet]
raze_router = "RAZEX9pxDuRCrtwR5wxUPAX3pWwAkBzvM8hF2fKaRE9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "echo 'use litesvm harness: cargo test --features test-sbf'"

# No devnet/testnet: validate against a local validator forked from mainnet.
# `anchor test --skip-deploy` after `solana-test-validator` with the clones below,
# or use the in-crate litesvm harness (tests/) which loads real .so + real account state.
[test.validator]
url = "https://api.mainnet-beta.solana.com"

